
name: AskyriaPlugin
version: 1.0.0
main: com.askyria.plugin.AskyriaPlugin
api-version: '1.21'
author: Swyft
description: Custom plugins for the Askyria Minecraft server

commands:
  askyria:
    description: Welcome to Askyria
    usage: /askyria
  playertag:
    description: Set a player's tag color
    usage: /playertag <player> <color>

permissions:
  askyria.admin:
    description: Allows managing player tags
    default: op
